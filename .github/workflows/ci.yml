name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One macOS job builds once, then runs the unit tests with the coverage gate and the two offscreen
# render groups. The render groups are listed here so the gate skips them; any other test class,
# including a new one, runs in the gate.
env:
  UI_TESTS_DEX: DexBackNavigationTests|DexColorRenderingTests|CollectionReadabilityRenderingTests
  UI_TESTS_SETTINGS: SnapshotHistoryRenderingTests|FormMetadataNoteRenderingTests|ZeroUsageHomeRenderingTests|SessionKeySettingsRenderingTests

jobs:
  # macOS runners are the scarce resource. A change that touches none of the Swift build/test inputs
  # skips the macOS jobs; they still report as skipped, so required checks and merge-pr.sh don't hang.
  # Not inputs: bot/ (bot.yml tests it), assets/landing/, docs/ and *.md, except
  # docs/reference/evolution-mapping.md, which EvolutionMappingDocTests reads.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Swift-relevant changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          swift=true
          if files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            relevant=$(grep -vE '^(bot/|assets/landing/|docs/)|\.md$' <<<"$files" || true)
            relevant+=$(grep -x 'docs/reference/evolution-mapping.md' <<<"$files" || true)
            [ -z "$relevant" ] && swift=false
          fi
          echo "Swift-relevant changes: $swift"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  build-test:
    name: build-test
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # Same flags as test-gate.sh's `swift test --enable-code-coverage`, so the gate reuses this
      # build instead of recompiling. A compile error fails here, before any test starts.
      - name: Build (app + tests, with coverage)
        run: swift build --build-tests --enable-code-coverage

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate (all but the UI render tests)
        env:
          SWIFT_TEST_SKIP: ${{ env.UI_TESTS_DEX }}|${{ env.UI_TESTS_SETTINGS }}
        run: ./scripts/test-gate.sh

      - name: UI render tests (dex)
        if: ${{ !cancelled() }}
        env:
          PTB_SNAPSHOT_SCREENSHOT_DIR: ${{ runner.temp }}/dex-renders
          PTB_ZERO_USAGE_SCREENSHOT_DIR: ${{ runner.temp }}/dex-renders/zero-usage
        run: swift test --skip-build --enable-code-coverage --filter "$UI_TESTS_DEX"

      - name: UI render tests (settings)
        if: ${{ !cancelled() }}
        env:
          PTB_SNAPSHOT_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders
          PTB_ZERO_USAGE_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders/zero-usage
        run: swift test --skip-build --enable-code-coverage --filter "$UI_TESTS_SETTINGS"

      - name: Preserve dex renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-renders
          path: ${{ runner.temp }}/dex-renders
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve native snapshot-history renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-history-renders
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single check to require: it always reports, and passes when every needed job succeeded or was skipped.
  ci-ok:
    name: ci-ok
    needs: [changes, build-test, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
