name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Vision/OCR render tests are about 60% of the test time and need no coverage, so they run
# in the ui-tests jobs in parallel. Any other test class, including a new one, runs in build-test.
env:
  UI_TESTS_DEX: DexBackNavigationTests|DexColorRenderingTests|CollectionReadabilityRenderingTests
  FLAKY_TEST: DexBackNavigationTests/testRegionChipFiltersMountedCollectionAndTogglesBack
  UI_TESTS_SETTINGS: SnapshotHistoryRenderingTests|FormMetadataNoteRenderingTests|ZeroUsageHomeRenderingTests|SessionKeySettingsRenderingTests

jobs:
  build-test:
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # Same flags as test-gate.sh's `swift test --enable-code-coverage`, so the gate reuses this
      # build instead of recompiling. A compile error fails here, before any test starts.
      - name: Build (app + tests, with coverage)
        run: swift build --build-tests --enable-code-coverage

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate (all but the UI render tests)
        env:
          SWIFT_TEST_SKIP: ${{ env.UI_TESTS_DEX }}|${{ env.UI_TESTS_SETTINGS }}
        run: ./scripts/test-gate.sh

  ui-tests:
    name: ui-tests (${{ matrix.shard }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: dex
            artifact: dex-renders
          - shard: settings
            artifact: snapshot-history-renders
    steps:
      - uses: actions/checkout@v5

      - name: Build tests
        run: swift build --build-tests

      - name: Run UI render tests
        env:
          PTB_SNAPSHOT_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders
          PTB_ZERO_USAGE_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders/zero-usage
          TESTS: ${{ matrix.shard == 'dex' && env.UI_TESTS_DEX || env.UI_TESTS_SETTINGS }}
        run: swift test --skip-build --filter "$TESTS" --skip "$FLAKY_TEST"

      # Reads the region chip by OCR and fails at random on CI; it passes or fails the job on the
      # second attempt. Remove the skip above and this step once the test is fixed.
      - name: Run the region chip test (one retry)
        if: matrix.shard == 'dex' && !cancelled()
        run: swift test --skip-build --filter "$FLAKY_TEST" || swift test --skip-build --filter "$FLAKY_TEST"

      - name: Preserve native snapshot-history renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
